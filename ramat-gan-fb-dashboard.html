<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #d4a017;
    --gold-dim: rgba(212,160,23,0.12);
    --bg: #f5f5f0;
    --surface: #ffffff;
    --surface2: #f8f8f5;
    --border: rgba(0,0,0,0.08);
    --text: #1a1a1a;
    --muted: #888;
    --green: #2ecc71;
    --red: #e74c3c;
  }

  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, rgba(212,160,23,0.06) 0%, #ffffff 60%);
    border-bottom: 1px solid rgba(0,0,0,0.08);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(12px); background: rgba(255,255,255,0.95);
  }

  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon { font-size: 26px; }
  .logo-text h1 { font-size: 18px; font-weight: 900; color: var(--gold); letter-spacing: -0.02em; }
  .logo-text p { font-size: 11px; color: var(--muted); }

  #fb-login-btn {
    display: flex; align-items: center; gap: 8px;
    background: #1877f2; color: white;
    border: none; border-radius: 9px; padding: 10px 20px;
    font-family: 'Heebo', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
  }
  #fb-login-btn:hover { background: #166fe5; transform: translateY(-1px); }
  #fb-login-btn .fb-icon { font-size: 16px; }

  #user-info {
    display: none; align-items: center; gap: 10px;
  }
  #user-info img {
    width: 36px; height: 36px; border-radius: 50%;
    border: 2px solid var(--gold);
  }
  #user-info span { font-size: 13px; font-weight: 600; }

  /* ── STATS BAR ── */
  .stats-bar {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    padding: 20px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .stat-card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
    transition: border-color 0.2s;
  }
  .stat-card:hover { border-color: rgba(245,200,66,0.2); }
  .stat-icon { font-size: 18px; margin-bottom: 6px; }
  .stat-val { font-size: 22px; font-weight: 900; color: var(--gold); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 3px; }

  /* ── MAIN LAYOUT ── */
  .main-layout {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 140px);
  }

  /* ── LEFT PANEL (listings) ── */
  .listings-panel {
    flex: 1;
    width: 100%;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px;
    background: var(--surface);
  }

  .panel-title { font-size: 13px; font-weight: 700; color: var(--gold); }

  .search-row {
    display: flex; gap: 8px;
  }

  input[type="text"], input[type="number"], select {
    background: rgba(0,0,0,0.03);
    border: 1px solid var(--border);
    border-radius: 8px; color: var(--text);
    padding: 8px 12px; font-size: 12px;
    font-family: 'Heebo', sans-serif; direction: rtl;
    outline: none; transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: rgba(245,200,66,0.3); }

  .search-input { flex: 1; }
  .filter-select { width: 110px; cursor: pointer; }

  .filters-row { display: flex; gap: 8px; }
  .price-input { width: 120px; }

  #sort-select { flex: 1; cursor: pointer; }

  .listings-list {
    flex: 1; overflow-y: auto;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
    align-content: start;
  }
  .listings-list::-webkit-scrollbar { width: 4px; }
  .listings-list::-webkit-scrollbar-track { background: transparent; }
  .listings-list::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

  /* ── LISTING CARD ── */
  .listing-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
    cursor: pointer; transition: all 0.2s;
    position: relative; overflow: hidden;
  }
  .listing-card:hover { border-color: rgba(245,200,66,0.3); transform: translateY(-1px); }
  .listing-card.active { border-color: var(--gold); background: rgba(245,200,66,0.06); }
  .listing-card.saved { border-color: rgba(245,200,66,0.25); }

  .saved-badge {
    position: absolute; top: 0; left: 0;
    background: var(--gold); color: #111;
    font-size: 9px; font-weight: 800;
    padding: 3px 10px; border-bottom-right-radius: 8px;
    letter-spacing: 0.04em;
  }

  .card-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 8px;
  }
  .card-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .card-address { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .card-price {
    font-size: 20px; font-weight: 900; color: var(--gold);
    white-space: nowrap;
  }
  .card-price-sub { font-size: 10px; color: var(--muted); text-align: center; }

  .card-details {
    display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
  }
  .detail-chip {
    background: rgba(0,0,0,0.03);
    border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 9px;
    font-size: 11px; color: #333;
    display: flex; align-items: center; gap: 4px;
  }

  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .tag {
    background: var(--gold-dim); color: var(--gold);
    border: 1px solid rgba(245,200,66,0.2);
    border-radius: 4px; padding: 2px 7px;
    font-size: 10px; font-weight: 700;
  }

  .card-footer {
    display: flex; justify-content: space-between; align-items: center;
  }
  .card-source { font-size: 10px; color: #333; }
  .card-actions { display: flex; gap: 6px; }

  .btn-save, .btn-contact, .btn-delete {
    border: none; border-radius: 6px; padding: 5px 10px;
    font-size: 11px; font-weight: 700; cursor: pointer;
    font-family: 'Heebo', sans-serif; transition: all 0.2s;
  }
  .btn-save {
    background: rgba(0,0,0,0.04); color: #777;
    border: 1px solid rgba(0,0,0,0.08);
  }
  .btn-save.active { background: var(--gold-dim); color: var(--gold); border-color: rgba(245,200,66,0.3); }
  .btn-contact { background: rgba(46,204,113,0.12); color: var(--green); border: 1px solid rgba(46,204,113,0.2); }
  .btn-delete { background: rgba(231,76,60,0.08); color: var(--red); border: 1px solid rgba(231,76,60,0.15); }

  .neighborhood-btn {
    background: rgba(0,0,0,0.04); color: #555;
    border: 1px solid rgba(0,0,0,0.1);
    border-radius: 20px; padding: 4px 12px;
    font-size: 11px; font-weight: 700; cursor: pointer;
    font-family: 'Heebo', sans-serif; transition: all 0.15s;
  }
  .neighborhood-btn:hover { border-color: var(--gold); color: var(--gold); }
  .neighborhood-btn.active {
    background: var(--gold); color: #111;
    border-color: var(--gold);
  }

  /* ── MAP ── */
  #map {
    flex: 1;
    z-index: 0;
  }

  /* ── EMPTY / LOADING STATE ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 40px; text-align: center;
    color: var(--muted); flex: 1;
  }
  .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 13px; line-height: 1.7; }

  /* ── FB FETCH PANEL ── */
  .fb-fetch-bar {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(24,119,242,0.05);
    display: none;
    flex-direction: column; gap: 8px;
  }
  .fb-fetch-bar.visible { display: flex; }
  .fb-fetch-bar label { font-size: 11px; color: #777; }
  .fb-fetch-row { display: flex; gap: 8px; align-items: center; }
  .fb-fetch-row input { flex: 1; }

  #fetch-btn {
    background: #1877f2; color: white; border: none;
    border-radius: 8px; padding: 8px 16px;
    font-family: 'Heebo', sans-serif; font-size: 12px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
  }
  #fetch-btn:hover { background: #166fe5; }
  #fetch-btn:disabled { background: #333; color: #555; cursor: not-allowed; }

  /* leaflet popups RTL */
  .leaflet-popup-content { direction: rtl; font-family: 'Heebo', sans-serif; min-width: 180px; }
  .popup-price { font-size: 18px; font-weight: 900; color: #e6a800; }
  .popup-title { font-weight: 700; margin-bottom: 4px; }
  .popup-detail { font-size: 12px; color: #333; }

  /* count badge */
  .count-badge {
    display: inline-block;
    background: var(--gold-dim); color: var(--gold);
    border: 1px solid rgba(245,200,66,0.2);
    border-radius: 20px; padding: 2px 10px;
    font-size: 11px; font-weight: 700;
    margin-right: 8px;
  }

  @media (max-width: 768px) {
    .main-layout { grid-template-columns: 1fr; grid-template-rows: 50vh 50vh; }
    .stats-bar { grid-template-columns: repeat(2,1fr); }
  }
</style>
</head>

<header>
  <div class="logo">
    <div class="logo-icon">🏠</div>
    <div class="logo-text">
      <h1>מודעות שכירות — רמת גן</h1>
      <p>שואב ומנתח מודעות מקבוצות פייסבוק</p>
    </div>
  </div>
</header>

<!-- Stats bar -->
<div class="stats-bar">
  <div class="stat-card">
    <div class="stat-icon">📋</div>
    <div class="stat-val" id="stat-count">0</div>
    <div class="stat-label">סה״כ מודעות</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">📊</div>
    <div class="stat-val" id="stat-avg">—</div>

  </div>
  <div class="stat-card">
    <div class="stat-icon">⬇️</div>
    <div class="stat-val" id="stat-min">—</div>

  </div>
  <div class="stat-card">
    <div class="stat-icon">📍</div>
    <div class="stat-val" id="stat-groups">0</div>
    <div class="stat-label">קבוצות מחוברות</div>
  </div>
</div>

<div class="main-layout">
  <!-- LEFT: Listings Panel -->
  <div class="listings-panel">
    <div class="panel-header">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="panel-title">מודעות <span class="count-badge" id="result-count">0</span></span>
        <button onclick="showAddModal()" style="background:var(--gold);color:#111;border:none;border-radius:7px;padding:6px 14px;font-size:12px;font-weight:800;cursor:pointer;font-family:'Heebo',sans-serif;">+ הוסף</button>
      </div>

      <div class="search-row">
        <input type="text" class="search-input" id="search-input" placeholder="🔍 חפש..." oninput="renderListings()">
        <select class="filter-select" id="filter-rooms" onchange="renderListings()">
          <option value="">כל החדרים</option>
          <option value="1">1</option><option value="1.5">1.5</option>
          <option value="2">2</option><option value="2.5">2.5</option>
          <option value="3">3</option><option value="3.5">3.5</option>
          <option value="4" selected>4+</option><option value="4.5">4.5</option>
          <option value="5">5+</option>

      <div class="filters-row">
        <input type="number" class="price-input" id="filter-max-price" placeholder="מחיר מקס ₪" oninput="renderListings()">
        <select id="sort-select" onchange="renderListings()">
          <option value="date">מיון: תאריך</option>
          <option value="price_asc">מחיר ↑</option>
          <option value="price_desc">מחיר ↓</option>
          <option value="rooms">חדרים</option>

        <button onclick="toggleSavedOnly()" id="saved-btn"
          style="background:rgba(255,255,255,0.04);color:#888;border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Heebo',sans-serif;white-space:nowrap;">
          ☆ שמורים
        </button>
      </div>
    </div>

    <div class="listings-list" id="listings-list">
      <div class="empty-state">
        <div class="big-icon">🏘️</div>
        <p>השתמש בתוסף כדי לאסוף מודעות<br>או הוסף ידנית עם כפתור +</p>
      </div>
    </div>
  </div>

  <!-- RIGHT: Map (hidden by default, shown on demand) -->
  <div id="map" style="display:none;"></div>
</div>

<!-- Map Modal -->
<div id="map-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:16px;width:80vw;height:80vh;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.4);">

<!-- Add Modal -->

  <div style="background:#15151f;border:1px solid rgba(245,200,66,0.2);border-radius:16px;padding:28px;width:460px;max-width:95vw;direction:rtl;font-family:'Heebo',sans-serif;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">

        <label style="font-size:11px;color:#888;display:block;margin-bottom:5px;">כותרת *</label>

      </div>
      <div>
        <label style="font-size:11px;color:#888;display:block;margin-bottom:5px;">מחיר ₪ *</label>
        <input type="number" id="m-price" placeholder="6500" style="width:100%;">
      </div>
      <div>
        <label style="font-size:11px;color:#888;display:block;margin-bottom:5px;">חדרים</label>
        <input type="number" id="m-rooms" placeholder="3" step="0.5" style="width:100%;">

        <input type="number" id="m-size" placeholder="80" style="width:100%;">
      </div>
      <div>
        <label style="font-size:11px;color:#888;display:block;margin-bottom:5px;">טלפון</label>
        <input type="text" id="m-contact" placeholder="054-..." style="width:100%;">
      </div>
      <div style="grid-column:1/-1;">
        <label style="font-size:11px;color:#888;display:block;margin-bottom:5px;">מקור</label>

      </div>

        <label style="font-size:11px;color:#888;display:block;margin-bottom:5px;">תיאור</label>
        <textarea id="m-desc" rows="2" placeholder="תיאור קצר..." style="width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:8px;color:#f0f0f0;padding:8px 12px;font-size:12px;font-family:'Heebo',sans-serif;resize:none;outline:none;direction:rtl;"></textarea>
      </div>
    </div>
    <button onclick="addManualListing()" style="margin-top:16px;width:100%;background:var(--gold);color:#111;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Heebo',sans-serif;">
      + הוסף מודעה
    </button>
  </div>
</div>

<script>
// ── STATE ──
let listings = [];
let activeId = null;
let savedOnly = false;
let activeHood = 'הכל';
let mapMarkers = {};
let geocodeCache = {};

// No sample data — real listings only
const SAMPLES = [];

// ── MAP INIT ──
let map;
let infoWindow;
let geocoder;

// initMap is defined in the head script block and called after Google Maps loads


function priceColor(price) {
  if (!price) return '#888888';
  if (price < 5500) return '#2ecc71';
  if (price < 7500) return '#f5c842';
  return '#e74c3c';
}

function addMapMarker(listing) {
  if (!listing.lat || !listing.lng) return;
  if (mapMarkers[listing.id]) { mapMarkers[listing.id].setMap(null); }

  const color = priceColor(listing.price);
  const priceLabel = '₪' + (listing.price || 0).toLocaleString();

  const marker = new google.maps.Marker({
    position: { lat: listing.lat, lng: listing.lng },
    map,
    label: {
      text: priceLabel,
      color: '#111111',
      fontWeight: 'bold',
      fontSize: '11px',
      fontFamily: 'Arial, sans-serif',
    },
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      fillColor: color,
      fillOpacity: 1,
      strokeColor: 'rgba(0,0,0,0.3)',
      strokeWeight: 2,
      scale: 18,
    },
    title: listing.title,
  });

  // Use a custom overlay for pill-shaped labels
  const overlay = new google.maps.marker.AdvancedMarkerElement
    ? null : null; // fallback to standard marker

  marker.addListener('click', () => {
    setActive(listing.id);
    infoWindow.setContent(`
      <div style="direction:rtl;font-family:Heebo,Arial,sans-serif;min-width:180px;padding:4px;">
        <div style="font-weight:800;font-size:14px;margin-bottom:4px;">${listing.title}</div>
        <div style="font-size:18px;font-weight:900;color:#d4a017;">₪${(listing.price||0).toLocaleString()}</div>
        <div style="font-size:12px;color:#555;margin-top:4px;">📍 ${listing.address || ''}</div>
        <div style="font-size:12px;color:#555;">🛏 ${listing.rooms || '?'} חדרים${listing.size ? ` · ${listing.size} מ״ר` : ''}${listing.floor != null ? ` · קומה ${listing.floor}` : ''}</div>
        ${listing.contact ? `<div style="margin-top:8px;"><a href="tel:${listing.contact}" style="color:#1877f2;font-weight:700;">📞 ${listing.contact}</a></div>` : ''}
      </div>
    `);
    infoWindow.open(map, marker);
  });

  mapMarkers[listing.id] = marker;
}

function removeMapMarker(id) {
  if (mapMarkers[id]) { mapMarkers[id].setMap(null); delete mapMarkers[id]; }
}

// Geocode using Google Maps Geocoding API
async function geocode(address) {
  if (geocodeCache[address]) return geocodeCache[address];
  return new Promise((resolve) => {
    geocoder.geocode({ address: address + ', Israel' }, (results, status) => {
      if (status === 'OK' && results[0]) {
        const loc = results[0].geometry.location;
        const coords = { lat: loc.lat(), lng: loc.lng() };
        geocodeCache[address] = coords;
        resolve(coords);
      } else {
        resolve(null);
      }
    });
  });
}

// ── LISTING MANAGEMENT ──
function addListing(l) {
  listings.unshift(l);
  if (l.lat && l.lng) addMapMarker(l);
  else if (l.address) {
    geocode(l.address).then(coords => {
      if (coords) {
        l.lat = coords.lat; l.lng = coords.lng;
        addMapMarker(l);
      }
    });
  }
  updateStats();
  renderListings();
}

function deleteListing(id) {
  listings = listings.filter(l => l.id !== id);
  removeMapMarker(id);
  updateStats();
  renderListings();
}

function toggleSave(id) {
  const l = listings.find(l => l.id === id);
  if (l) { l.saved = !l.saved; renderListings(); }
}

function showOnMap(id) {
  const l = listings.find(l => l.id === id);
  if (!l || !l.lat || !l.lng) return;
  document.getElementById('map-modal').style.display = 'flex';
  // Trigger map resize after modal is visible
  setTimeout(() => {
    google.maps.event.trigger(map, 'resize');
    map.panTo({ lat: l.lat, lng: l.lng });
    map.setZoom(16);
    if (mapMarkers[id]) google.maps.event.trigger(mapMarkers[id], 'click');
  }, 100);
}

function closeMapModal() {
  document.getElementById('map-modal').style.display = 'none';
}

// Close modal on backdrop click
document.addEventListener('click', (e) => {
  if (e.target.id === 'map-modal') closeMapModal();
});

function setActive(id) {
  activeId = id;
  renderListings();
}

// ── RENDER ──
function toggleNeighborhood(btn, hood) {
  activeHood = hood;
  document.querySelectorAll('.neighborhood-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderListings();
}

function getFiltered() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const rooms = document.getElementById('filter-rooms').value;
  const maxPrice = parseInt(document.getElementById('filter-max-price').value) || Infinity;
  const sort = document.getElementById('sort-select').value;

  let result = listings.filter(l => {
    const matchSearch = !search || [l.title, l.address, l.description, ...(l.tags||[])].join(' ').toLowerCase().includes(search);
    const matchRooms = !rooms || l.rooms >= parseFloat(rooms);
    const matchPrice = !l.price || l.price <= maxPrice;
    const matchSaved = !savedOnly || l.saved;
    const matchHood = activeHood === 'הכל' || (l.address || '').includes(activeHood) || (l.title || '').includes(activeHood) || (l.description || '').includes(activeHood);
    return matchSearch && matchRooms && matchPrice && matchSaved && matchHood;
  });

  result.sort((a, b) => {
    if (sort === 'price_asc') return (a.price||0) - (b.price||0);
    if (sort === 'price_desc') return (b.price||0) - (a.price||0);
    if (sort === 'rooms') return (b.rooms||0) - (a.rooms||0);
    return (b.date||'').localeCompare(a.date||'');
  });

  return result;
}

function renderListings() {
  const container = document.getElementById('listings-list');
  const filtered = getFiltered();
  document.getElementById('result-count').textContent = filtered.length;

  if (!filtered.length) {
    container.innerHTML = `<div class="empty-state"><div class="big-icon">🔍</div><p>אין תוצאות</p></div>`;
    return;
  }

  container.innerHTML = filtered.map(l => `
    <div class="listing-card ${l.id === activeId ? 'active' : ''} ${l.saved ? 'saved' : ''}" onclick="setActive(${l.id})">
      ${l.saved ? '<div class="saved-badge">★ שמור</div>' : ''}
      <div class="card-top">
        <div>
          <div class="card-title">${l.title || 'ללא כותרת'}</div>
          <div class="card-address">📍 ${l.address || '—'}</div>
        </div>
        <div style="text-align:center">
          <div class="card-price" style="color:${priceColor(l.price)}">₪${(l.price||0).toLocaleString()}</div>
          <div class="card-price-sub">לחודש</div>
        </div>
      </div>
      <div class="card-details">
        ${l.rooms ? `<div class="detail-chip">🛏 ${l.rooms} חד׳</div>` : ''}
        ${l.size ? `<div class="detail-chip">📐 ${l.size} מ״ר</div>` : ''}
        ${l.floor != null ? `<div class="detail-chip">🏢 קומה ${l.floor}</div>` : ''}
      </div>
      ${l.tags?.length ? `<div class="card-tags">${l.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
      <div class="card-footer">
        <div class="card-source">📣 ${l.source || ''} · ${l.date || ''}</div>
        <div class="card-actions">
          ${(l.lat && l.lng) ? `<button class="btn-contact" style="background:rgba(26,115,232,0.1);color:#1a73e8;border:1px solid rgba(26,115,232,0.2);" onclick="event.stopPropagation();showOnMap(${l.id})">🗺️ מפה</button>` : ''}
          ${l.contact ? `<button class="btn-contact" onclick="event.stopPropagation();window.open('tel:${l.contact}')">📞</button>` : ''}
          <button class="btn-save ${l.saved ? 'active' : ''}" onclick="event.stopPropagation();toggleSave(${l.id})">${l.saved ? '★' : '☆'}</button>
          <button class="btn-delete" onclick="event.stopPropagation();deleteListing(${l.id})">✕</button>
        </div>
      </div>
    </div>
  `).join('');
}

function updateStats() {
  const prices = listings.map(l => l.price).filter(Boolean);
  document.getElementById('stat-count').textContent = listings.length;
  document.getElementById('stat-avg').textContent = prices.length ? `₪${Math.round(prices.reduce((a,b)=>a+b,0)/prices.length).toLocaleString()}` : '—';
  document.getElementById('stat-min').textContent = prices.length ? `₪${Math.min(...prices).toLocaleString()}` : '—';
}

function toggleSavedOnly() {
  savedOnly = !savedOnly;
  const btn = document.getElementById('saved-btn');
  btn.style.background = savedOnly ? 'var(--gold-dim)' : 'rgba(255,255,255,0.04)';
  btn.style.color = savedOnly ? 'var(--gold)' : '#888';
  btn.style.borderColor = savedOnly ? 'rgba(245,200,66,0.3)' : 'var(--border)';
  btn.textContent = savedOnly ? '★ שמורים' : '☆ שמורים';
  renderListings();
}

// ── ADD MODAL ──
function showAddModal() {
  document.getElementById('add-modal').style.display = 'flex';
}
function hideAddModal() {
  document.getElementById('add-modal').style.display = 'none';
}
function addManualListing() {
  const title = document.getElementById('m-title').value;
  const price = document.getElementById('m-price').value;
  if (!title || !price) return;
  addListing({
    id: Date.now(),
    title, price: parseInt(price),
    rooms: parseFloat(document.getElementById('m-rooms').value) || null,
    floor: document.getElementById('m-floor').value !== '' ? parseInt(document.getElementById('m-floor').value) : null,
    address: document.getElementById('m-address').value,
    size: document.getElementById('m-size').value ? parseInt(document.getElementById('m-size').value) : null,
    contact: document.getElementById('m-contact').value,
    description: document.getElementById('m-desc').value,
    source: document.getElementById('m-source').value || 'הוספה ידנית',
    date: new Date().toISOString().slice(0,10),
    tags: [], saved: false,
  });
  hideAddModal();
  ['m-title','m-price','m-rooms','m-floor','m-address','m-size','m-contact','m-source','m-desc'].forEach(id => {
    document.getElementById(id).value = '';
  });
}

// ── IMPORT FROM EXTENSION ──
function importFromExtension(posts) {
  if (!posts || !posts.length) return;

  // Clean URL
  window.history.replaceState({}, '', window.location.pathname);

  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;background:#f5c842;color:#111;text-align:center;padding:12px;font-family:Heebo,Arial,sans-serif;font-weight:800;font-size:14px;';
  banner.textContent = '⏳ Parsing ' + posts.length + ' posts with AI...';
  document.body.appendChild(banner);

  let done = 0;
  posts.forEach((postText, i) => {
    setTimeout(() => {
      fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: 'You are a rental listing parser for Israel. Extract data and return ONLY valid JSON, no markdown:\n{"title":"short title","price":number,"rooms":number,"floor":number_or_null,"address":"full address, Ramat Gan","size":number_or_null,"description":"max 100 chars","contact":"phone or null","tags":["tag1"]}',
          messages: [{ role: 'user', content: postText }]
        })
      })
      .then(r => r.json())
      .then(data => {
        const raw = (data.content?.[0]?.text || '{}').replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(raw);
        addListing({
          ...parsed,
          id: Date.now() + Math.random(),
          source: 'Extension Import',
          date: new Date().toISOString().slice(0, 10),
          tags: parsed.tags || [],
          saved: false,
          raw: postText,
        });
      })
      .catch(() => {})
      .finally(() => {
        done++;
        banner.textContent = '⏳ Parsing ' + done + '/' + posts.length + ' posts...';
        if (done === posts.length) {
          banner.style.background = '#2ecc71';
          banner.textContent = '✅ Imported ' + (listings.length - SAMPLES.length) + ' listings!';
          setTimeout(() => banner.remove(), 4000);
        }
      });
    }, i * 1200);
  });
}

// Import is triggered from initMap() after map is ready
