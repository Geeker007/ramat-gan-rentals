<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מודעות שכירות — רמת גן</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #d4a017;
    --gold-dim: rgba(212,160,23,0.12);
    --bg: #f5f5f0;
    --surface: #ffffff;
    --surface2: #f8f8f5;
    --border: rgba(0,0,0,0.08);
    --text: #1a1a1a;
    --muted: #888;
    --green: #2ecc71;
    --red: #e74c3c;
  }

  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  header {
    padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.95);
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }

  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon { font-size: 26px; }
  .logo-text h1 { font-size: 18px; font-weight: 900; color: var(--gold); letter-spacing: -0.02em; }
  .logo-text p { font-size: 11px; color: var(--muted); }

  .stats-bar {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    padding: 20px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .stat-card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
    transition: border-color 0.2s;
  }
  .stat-card:hover { border-color: rgba(245,200,66,0.2); }
  .stat-icon { font-size: 18px; margin-bottom: 6px; }
  .stat-val { font-size: 22px; font-weight: 900; color: var(--gold); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .listings-panel { width: 100%; display: flex; flex-direction: column; }

  .panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px;
    background: var(--surface);
  }

  .panel-title { font-size: 13px; font-weight: 700; color: var(--gold); }

  .search-row { display: flex; gap: 8px; }

  input[type="text"], input[type="number"], select, textarea {
    background: rgba(0,0,0,0.03);
    border: 1px solid var(--border);
    border-radius: 8px; color: var(--text);
    padding: 8px 12px; font-size: 12px;
    font-family: 'Heebo', sans-serif; direction: rtl;
    outline: none; transition: border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus { border-color: rgba(245,200,66,0.3); }

  .search-input { flex: 1; }
  .filter-select { width: 110px; cursor: pointer; }
  .filters-row { display: flex; gap: 8px; }
  .price-input { width: 120px; }
  #sort-select { flex: 1; cursor: pointer; }

  .listings-list {
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
  }

  .listing-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
    cursor: pointer; transition: all 0.2s;
    position: relative; overflow: hidden;
  }
  .listing-card:hover { border-color: rgba(245,200,66,0.3); transform: translateY(-1px); }
  .listing-card.active { border-color: var(--gold); background: rgba(245,200,66,0.06); }
  .listing-card.saved { border-color: rgba(245,200,66,0.25); }

  .saved-badge {
    position: absolute; top: 0; left: 0;
    background: var(--gold); color: #111;
    font-size: 9px; font-weight: 800;
    padding: 3px 10px; border-bottom-right-radius: 8px;
    letter-spacing: 0.04em;
  }

  .card-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 8px; gap: 12px;
  }
  .card-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .card-address { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .card-price { font-size: 20px; font-weight: 900; color: var(--gold); white-space: nowrap; }
  .card-price-sub { font-size: 10px; color: var(--muted); text-align: center; }

  .card-details { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .detail-chip {
    background: rgba(0,0,0,0.03);
    border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 9px;
    font-size: 11px; color: #333;
    display: flex; align-items: center; gap: 4px;
  }

  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .tag {
    background: var(--gold-dim); color: var(--gold);
    border: 1px solid rgba(245,200,66,0.2);
    border-radius: 4px; padding: 2px 7px;
    font-size: 10px; font-weight: 700;
  }

  .card-description {
    font-size: 11px; color: #555; line-height: 1.5;
    margin-bottom: 8px; max-height: 60px; overflow: hidden;
  }

  .card-footer {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px;
  }
  .card-source { font-size: 10px; color: #333; }
  .card-actions { display: flex; gap: 6px; }

  .btn-save, .btn-contact, .btn-delete {
    border: none; border-radius: 6px; padding: 5px 10px;
    font-size: 11px; font-weight: 700; cursor: pointer;
    font-family: 'Heebo', sans-serif; transition: all 0.2s;
  }
  .btn-save {
    background: rgba(0,0,0,0.04); color: #777;
    border: 1px solid rgba(0,0,0,0.08);
  }
  .btn-save.active { background: var(--gold-dim); color: var(--gold); border-color: rgba(245,200,66,0.3); }
  .btn-contact { background: rgba(46,204,113,0.12); color: var(--green); border: 1px solid rgba(46,204,113,0.2); }
  .btn-delete { background: rgba(231,76,60,0.08); color: var(--red); border: 1px solid rgba(231,76,60,0.15); }

  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 40px; text-align: center;
    color: var(--muted); grid-column: 1 / -1;
  }
  .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 13px; line-height: 1.7; }

  .count-badge {
    display: inline-block;
    background: var(--gold-dim); color: var(--gold);
    border: 1px solid rgba(245,200,66,0.2);
    border-radius: 20px; padding: 2px 10px;
    font-size: 11px; font-weight: 700;
    margin-right: 8px;
  }

  /* modal (add listing) */
  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-card {
    background: #fff; border-radius: 16px; padding: 28px;
    width: 460px; max-width: 95vw; direction: rtl;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }

  @media (max-width: 768px) {
    .stats-bar { grid-template-columns: repeat(3, 1fr); padding: 14px; gap: 8px; }
    .stat-card { padding: 10px; }
    .stat-val { font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🏠</div>
    <div class="logo-text">
      <h1>מודעות שכירות — רמת גן</h1>
      <p>שואב ומנתח מודעות מקבוצות פייסבוק</p>
    </div>
  </div>
</header>

<div class="stats-bar">
  <div class="stat-card">
    <div class="stat-icon">📋</div>
    <div class="stat-val" id="stat-count">0</div>
    <div class="stat-label">סה״כ מודעות</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">📊</div>
    <div class="stat-val" id="stat-avg">—</div>
    <div class="stat-label">מחיר ממוצע</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">⬇️</div>
    <div class="stat-val" id="stat-min">—</div>
    <div class="stat-label">הזול ביותר</div>
  </div>
</div>

<div class="listings-panel">
  <div class="panel-header">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="panel-title">מודעות <span class="count-badge" id="result-count">0</span></span>
      <button onclick="showAddModal()" style="background:var(--gold);color:#111;border:none;border-radius:7px;padding:6px 14px;font-size:12px;font-weight:800;cursor:pointer;font-family:'Heebo',sans-serif;">+ הוסף</button>
    </div>

    <div class="search-row">
      <input type="text" class="search-input" id="search-input" placeholder="🔍 חפש..." oninput="renderListings()">
      <select class="filter-select" id="filter-rooms" onchange="renderListings()">
        <option value="" selected>כל החדרים</option>
        <option value="1">1+</option><option value="1.5">1.5+</option>
        <option value="2">2+</option><option value="2.5">2.5+</option>
        <option value="3">3+</option><option value="3.5">3.5+</option>
        <option value="4">4+</option><option value="4.5">4.5+</option>
        <option value="5">5+</option>
      </select>
    </div>

    <div class="filters-row">
      <input type="number" class="price-input" id="filter-max-price" placeholder="מחיר מקס ₪" oninput="renderListings()">
      <select id="sort-select" onchange="renderListings()">
        <option value="date">מיון: תאריך</option>
        <option value="price_asc">מחיר ↑</option>
        <option value="price_desc">מחיר ↓</option>
        <option value="rooms">חדרים</option>
      </select>
      <button onclick="toggleSavedOnly()" id="saved-btn"
        style="background:rgba(0,0,0,0.03);color:#888;border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Heebo',sans-serif;white-space:nowrap;">
        ☆ שמורים
      </button>
    </div>
  </div>

  <div class="listings-list" id="listings-list">
    <div class="empty-state">
      <div class="big-icon">🏘️</div>
      <p>השתמש בתוסף כדי לאסוף מודעות<br>או הוסף ידנית עם כפתור +</p>
    </div>
  </div>
</div>

<!-- Add Modal -->
<div id="add-modal" class="modal-backdrop">
  <div class="modal-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <div style="font-size:16px;font-weight:800;color:var(--gold);">+ הוסף מודעה ידנית</div>
      <button onclick="hideAddModal()" style="background:none;border:none;color:#666;font-size:20px;cursor:pointer;">✕</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div style="grid-column:1/-1;">
        <label style="font-size:11px;color:#888;display:block;margin-bottom:5px;">כותרת *</label>
        <input type="text" id="m-title" placeholder="3 חד׳ ברח׳ ביאליק" style="width:100%;">
      </div>
      <div>
        <label style="font-size:11px;color:#888;display:block;margin-bottom:5px;">מחיר ₪ *</label>
        <input type="number" id="m-price" placeholder="6500" style="width:100%;">
      </div>
      <div>
        <label style="font-size:11px;color:#888;display:block;margin-bottom:5px;">חדרים</label>
        <input type="number" id="m-rooms" placeholder="3" step="0.5" style="width:100%;">
      </div>
      <div>
        <label style="font-size:11px;color:#888;display:block;margin-bottom:5px;">כתובת</label>
        <input type="text" id="m-address" placeholder="ביאליק 45, רמת גן" style="width:100%;">
      </div>
      <div>
        <label style="font-size:11px;color:#888;display:block;margin-bottom:5px;">קומה</label>
        <input type="number" id="m-floor" placeholder="2" style="width:100%;">
      </div>
      <div>
        <label style="font-size:11px;color:#888;display:block;margin-bottom:5px;">גודל מ״ר</label>
        <input type="number" id="m-size" placeholder="80" style="width:100%;">
      </div>
      <div>
        <label style="font-size:11px;color:#888;display:block;margin-bottom:5px;">טלפון</label>
        <input type="text" id="m-contact" placeholder="054-..." style="width:100%;">
      </div>
      <div style="grid-column:1/-1;">
        <label style="font-size:11px;color:#888;display:block;margin-bottom:5px;">מקור</label>
        <input type="text" id="m-source" placeholder="שם הקבוצה" style="width:100%;">
      </div>
      <div style="grid-column:1/-1;">
        <label style="font-size:11px;color:#888;display:block;margin-bottom:5px;">תיאור</label>
        <textarea id="m-desc" rows="2" placeholder="תיאור קצר..." style="width:100%;resize:none;"></textarea>
      </div>
    </div>
    <button onclick="addManualListing()" style="margin-top:16px;width:100%;background:var(--gold);color:#111;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Heebo',sans-serif;">
      + הוסף מודעה
    </button>
  </div>
</div>

<script>
// ═════════════════════════════════════════════════════════════════════
// CONFIG — set this after deploying your Cloudflare Worker.
// Or override at runtime: localStorage.setItem('aiProxyUrl', 'https://...')
// ═════════════════════════════════════════════════════════════════════
const DEFAULT_AI_PROXY_URL = 'https://rentals-proxy.example.workers.dev';
const GROQ_MODEL = 'llama-3.3-70b-versatile';

// ═════════════════════════════════════════════════════════════════════
// STATE
// ═════════════════════════════════════════════════════════════════════
let listings = [];
let activeId = null;
let savedOnly = false;

// ═════════════════════════════════════════════════════════════════════
// LISTING MANAGEMENT
// ═════════════════════════════════════════════════════════════════════
function addListing(l) {
  listings.unshift(l);
  updateStats();
  renderListings();
}

function deleteListing(id) {
  listings = listings.filter(l => l.id !== id);
  updateStats();
  renderListings();
}

function toggleSave(id) {
  const l = listings.find(l => l.id === id);
  if (l) { l.saved = !l.saved; renderListings(); }
}

function setActive(id) {
  activeId = id;
  renderListings();
}

// ═════════════════════════════════════════════════════════════════════
// RENDER
// ═════════════════════════════════════════════════════════════════════
function getFiltered() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const rooms = document.getElementById('filter-rooms').value;
  const maxPrice = parseInt(document.getElementById('filter-max-price').value) || Infinity;
  const sort = document.getElementById('sort-select').value;

  let result = listings.filter(l => {
    const matchSearch = !search || [l.title, l.address, l.description, ...(l.tags||[])].join(' ').toLowerCase().includes(search);
    const matchRooms = !rooms || l.rooms >= parseFloat(rooms);
    const matchPrice = !l.price || l.price <= maxPrice;
    const matchSaved = !savedOnly || l.saved;
    return matchSearch && matchRooms && matchPrice && matchSaved;
  });

  result.sort((a, b) => {
    if (sort === 'price_asc') return (a.price||0) - (b.price||0);
    if (sort === 'price_desc') return (b.price||0) - (a.price||0);
    if (sort === 'rooms') return (b.rooms||0) - (a.rooms||0);
    return (b.date||'').localeCompare(a.date||'');
  });

  return result;
}

function renderListings() {
  const container = document.getElementById('listings-list');
  const filtered = getFiltered();
  document.getElementById('result-count').textContent = filtered.length;

  if (!filtered.length) {
    container.innerHTML = `<div class="empty-state"><div class="big-icon">🔍</div><p>אין תוצאות</p></div>`;
    return;
  }

  container.innerHTML = filtered.map(l => `
    <div class="listing-card ${l.id === activeId ? 'active' : ''} ${l.saved ? 'saved' : ''}" onclick="setActive('${l.id}')">
      ${l.saved ? '<div class="saved-badge">★ שמור</div>' : ''}
      <div class="card-top">
        <div style="flex:1;min-width:0;">
          <div class="card-title">${escapeHtml(l.title || 'ללא כותרת')}</div>
          <div class="card-address">📍 ${escapeHtml(l.address || '—')}</div>
        </div>
        <div style="text-align:center">
          <div class="card-price">₪${(l.price||0).toLocaleString()}</div>
          <div class="card-price-sub">לחודש</div>
        </div>
      </div>
      <div class="card-details">
        ${l.rooms ? `<div class="detail-chip">🛏 ${l.rooms} חד׳</div>` : ''}
        ${l.size ? `<div class="detail-chip">📐 ${l.size} מ״ר</div>` : ''}
        ${l.floor != null ? `<div class="detail-chip">🏢 קומה ${l.floor}</div>` : ''}
      </div>
      ${l.description ? `<div class="card-description">${escapeHtml(l.description)}</div>` : ''}
      ${l.tags?.length ? `<div class="card-tags">${l.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      <div class="card-footer">
        <div class="card-source">📣 ${escapeHtml(l.source || '')} · ${l.date || ''}</div>
        <div class="card-actions">
          ${l.contact ? `<button class="btn-contact" onclick="event.stopPropagation();window.open('tel:${escapeHtml(l.contact)}')">📞</button>` : ''}
          <button class="btn-save ${l.saved ? 'active' : ''}" onclick="event.stopPropagation();toggleSave('${l.id}')">${l.saved ? '★' : '☆'}</button>
          <button class="btn-delete" onclick="event.stopPropagation();deleteListing('${l.id}')">✕</button>
        </div>
      </div>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function updateStats() {
  const prices = listings.map(l => l.price).filter(Boolean);
  document.getElementById('stat-count').textContent = listings.length;
  document.getElementById('stat-avg').textContent = prices.length ? `₪${Math.round(prices.reduce((a,b)=>a+b,0)/prices.length).toLocaleString()}` : '—';
  document.getElementById('stat-min').textContent = prices.length ? `₪${Math.min(...prices).toLocaleString()}` : '—';
}

function toggleSavedOnly() {
  savedOnly = !savedOnly;
  const btn = document.getElementById('saved-btn');
  btn.style.background = savedOnly ? 'var(--gold-dim)' : 'rgba(0,0,0,0.03)';
  btn.style.color = savedOnly ? 'var(--gold)' : '#888';
  btn.style.borderColor = savedOnly ? 'rgba(245,200,66,0.3)' : 'var(--border)';
  btn.textContent = savedOnly ? '★ שמורים' : '☆ שמורים';
  renderListings();
}

// ═════════════════════════════════════════════════════════════════════
// ADD MODAL
// ═════════════════════════════════════════════════════════════════════
function showAddModal() { document.getElementById('add-modal').style.display = 'flex'; }
function hideAddModal() { document.getElementById('add-modal').style.display = 'none'; }

function addManualListing() {
  const title = document.getElementById('m-title').value;
  const price = document.getElementById('m-price').value;
  if (!title || !price) return;
  addListing({
    id: String(Date.now()),
    title, price: parseInt(price),
    rooms: parseFloat(document.getElementById('m-rooms').value) || null,
    floor: document.getElementById('m-floor').value !== '' ? parseInt(document.getElementById('m-floor').value) : null,
    address: document.getElementById('m-address').value,
    size: document.getElementById('m-size').value ? parseInt(document.getElementById('m-size').value) : null,
    contact: document.getElementById('m-contact').value,
    description: document.getElementById('m-desc').value,
    source: document.getElementById('m-source').value || 'הוספה ידנית',
    date: new Date().toISOString().slice(0,10),
    tags: [], saved: false,
  });
  hideAddModal();
  ['m-title','m-price','m-rooms','m-floor','m-address','m-size','m-contact','m-source','m-desc'].forEach(id => {
    document.getElementById(id).value = '';
  });
}

// ═════════════════════════════════════════════════════════════════════
// EXTENSION IMPORT (localStorage bridge + Groq AI parsing)
// ═════════════════════════════════════════════════════════════════════
function getAiProxyUrl() {
  return localStorage.getItem('aiProxyUrl') || DEFAULT_AI_PROXY_URL;
}

function consumePendingPosts() {
  const raw = localStorage.getItem('pendingPosts');
  if (!raw) return;
  try {
    const posts = JSON.parse(raw);
    localStorage.removeItem('pendingPosts');
    if (Array.isArray(posts) && posts.length) {
      importFromExtension(posts);
    }
  } catch (e) {
    console.error('Failed to parse pendingPosts:', e);
    localStorage.removeItem('pendingPosts');
  }
}

function showBanner(text, color, autoHideMs) {
  let banner = document.getElementById('import-banner');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'import-banner';
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;color:#111;text-align:center;padding:12px;font-family:Heebo,Arial,sans-serif;font-weight:800;font-size:14px;';
    document.body.appendChild(banner);
  }
  banner.style.background = color;
  banner.textContent = text;
  if (autoHideMs) setTimeout(() => { if (banner) banner.remove(); }, autoHideMs);
  return banner;
}

function importFromExtension(posts) {
  if (!posts || !posts.length) return;

  const proxyUrl = getAiProxyUrl();
  if (!proxyUrl || proxyUrl.includes('example.workers.dev')) {
    showBanner(
      '⚠️ AI proxy לא מוגדר. ערוך DEFAULT_AI_PROXY_URL בקובץ ה-HTML או הרץ: localStorage.setItem("aiProxyUrl", "https://your-worker.workers.dev")',
      '#e74c3c',
      10000
    );
    return;
  }

  const banner = showBanner(`⏳ מנתח ${posts.length} פוסטים עם AI...`, '#f5c842');

  const systemPrompt =
    'You are a rental-listing parser for Israel (Ramat Gan). Given raw Hebrew Facebook post text, extract a rental listing. ' +
    'Return ONLY valid minified JSON, no markdown, no prose. Schema:\n' +
    '{"title":"short title in Hebrew","price":number,"rooms":number_or_null,"floor":number_or_null,' +
    '"address":"full address","size":number_or_null,"description":"<=100 chars in Hebrew",' +
    '"contact":"phone_or_null","tags":["tag1","tag2"]}\n' +
    'If the post is not a rental listing, return {"skip":true}. Prices must be numbers (strip ₪/שח).';

  let done = 0;
  let imported = 0;
  let skipped = 0;
  let failed = 0;

  posts.forEach((postText, i) => {
    setTimeout(() => {
      fetch(proxyUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: GROQ_MODEL,
          max_tokens: 500,
          temperature: 0.1,
          messages: [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: postText },
          ],
        }),
      })
      .then((r) => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then((data) => {
        // Groq response shape: { choices: [{ message: { content: "..." } }] }
        const raw = (data.choices?.[0]?.message?.content || '{}')
          .replace(/```json|```/g, '')
          .trim();
        const parsed = JSON.parse(raw);

        if (parsed.skip) {
          skipped++;
          return;
        }

        addListing({
          ...parsed,
          id: `${Date.now()}-${i}`,
          source: 'Extension Import',
          date: new Date().toISOString().slice(0, 10),
          tags: parsed.tags || [],
          saved: false,
          raw: postText,
        });
        imported++;
      })
      .catch((err) => {
        failed++;
        console.error('Parse failed for post', i, err);
      })
      .finally(() => {
        done++;
        if (done < posts.length) {
          banner.textContent = `⏳ מנתח ${done}/${posts.length}... (${imported} נוספו, ${skipped} לא רלוונטיים, ${failed} נכשלו)`;
        } else {
          banner.style.background = failed === posts.length ? '#e74c3c' : '#2ecc71';
          banner.textContent = `✅ נוספו ${imported} מודעות · ${skipped} לא רלוונטיים · ${failed} נכשלו`;
          setTimeout(() => banner.remove(), 5000);
        }
      });
    }, i * 500); // 500ms between requests — Groq free tier rate limit is ~30/min
  });
}

// ═════════════════════════════════════════════════════════════════════
// INIT
// ═════════════════════════════════════════════════════════════════════
function init() {
  updateStats();
  renderListings();
  consumePendingPosts();
  window.addEventListener('rentals-import-ready', consumePendingPosts);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// Close modal on backdrop click
document.addEventListener('click', (e) => {
  if (e.target.id === 'add-modal') hideAddModal();
});
</script>
